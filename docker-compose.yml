services:
  wgrest:
    build:
      context: ./wgrest-build
      dockerfile: Dockerfile
    image: wgrest:local
    container_name: wgrest
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /var/lib/wgrest/wireguard:/var/lib/wgrest/wireguard
    environment:
      - WGREST_LISTEN=10.11.0.1:7070
      # Not under /etc/wireguard: see scripts/wg-conf.sh.
      - WGREST_CONFIG_DIR=/var/lib/wgrest/wireguard
      # The pinned wgrest reads only this name. The old WGREST_AUTH_TOKEN was
      # silently ignored, leaving the API open.
      - WGREST_STATIC_AUTH_TOKEN=${WGREST_API_KEY}